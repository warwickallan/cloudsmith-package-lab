
name: Build and Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run automated tests
        run: npm test

      - name: Package software
        run: npm pack

      - name: Show build artifact
        run: ls -lh *.tgz
      
      - name: Set up Cloudsmith authentication
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          oidc-namespace: foundry_lab
          oidc-service-slug: github-actions-publisher-km1l

      - name: Verify Cloudsmith identity
        run: cloudsmith whoami
        
      - name: Publish to Cloudsmith
        if: github.event_name == 'workflow_dispatch'
        run: cloudsmith push npm foundry_lab/onboarding-lab ./*.tgz

